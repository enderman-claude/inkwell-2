<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwell 2 prototype</title>
<style>
:root{--graphite:#2A2A27;--slate:#D9D6CC;--bone:#EEECE4;--iron:#3B4F6B;--rust:#A4512E;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--graphite);color:var(--bone);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.board{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:1040px;align-items:flex-start}
.panel{background:var(--slate);color:var(--graphite);border-radius:12px;padding:12px}
#pad{display:block;width:100%;max-width:680px;height:auto;aspect-ratio:680/440;background:var(--bone);border-radius:12px;touch-action:none;cursor:crosshair}
.pad-wrap{flex:1 1 560px;max-width:680px}
.row{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--iron)}
button{font:inherit;color:var(--graphite);background:transparent;border:0.5px solid var(--iron);border-radius:6px;cursor:pointer;padding:4px 8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--iron);outline-offset:2px}
button.on{background:var(--iron);color:var(--bone)}
.sw{width:22px;height:22px;padding:0;border-radius:5px;border:0.5px solid var(--graphite)}
.sw.linked{border:2px solid var(--graphite)}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.picker{width:260px}
#wheel{width:200px;height:200px;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
.num{width:44px;font:inherit;padding:2px 4px;border:0.5px solid var(--iron);border-radius:6px;background:var(--bone);color:var(--graphite)}
.lbl{width:14px;opacity:.7}
.chip{width:34px;text-align:right;font-variant-numeric:tabular-nums}
#preview{width:36px;height:36px;border-radius:8px;border:0.5px solid var(--graphite)}
.bar{position:relative;display:flex;gap:6px;align-items:center;background:var(--slate);color:var(--graphite);padding:8px;border-radius:12px;width:100%;max-width:1040px}
.slot{min-width:56px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.slot small{font-size:10px;opacity:.7}
.slot.on{background:var(--iron);color:var(--bone)}
.slot.on small{opacity:.9}
#menu{position:absolute;bottom:calc(100% + 8px);right:8px;display:none;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--slate);padding:8px;border-radius:12px;box-shadow:0 0 0 0.5px var(--graphite)}
#menu.open{display:grid}
#menu .slot{min-width:72px}
.grow{flex:1}
</style>
</head>
<body>
<div class="board">
  <div class="pad-wrap">
    <canvas id="pad" width="680" height="440" aria-label="Drawing pad"></canvas>
    <div class="panel row" style="margin-top:12px">
      <span style="min-width:80px">Stabiliser</span>
      <input id="stab" type="range" min="0" max="92" value="40">
      <span id="sv" class="chip">40</span>
      <button id="clear">Clear page</button>
    </div>
  </div>
  <div class="panel picker" id="picker">
    <div class="row" style="margin-bottom:10px">
      <span id="preview"></span>
      <input id="hex" maxlength="7" style="width:84px;font:inherit;border:none;background:transparent;color:var(--graphite);opacity:.7">
    </div>
    <canvas id="wheel" width="200" height="200" aria-label="Hue and saturation wheel"></canvas>
    <div id="mini" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px"></div>
    <div class="tabs" style="margin-top:10px">
      <button class="seg on" data-m="rgb">RGB</button>
      <button class="seg" data-m="hsv">HSV</button>
      <button class="seg" data-m="cmyk">CMYK</button>
    </div>
    <div id="rows" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div>

<div class="bar" role="toolbar" aria-label="Brush slots">
  <div id="bar" style="display:flex;gap:6px"></div>
  <div class="grow"></div>
  <span id="brushName" style="margin-right:8px"></span>
  <button id="more" aria-expanded="false" aria-controls="menu" aria-label="Slots 4 to 9">More</button>
  <div id="menu" role="group" aria-label="Quick access"></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hsvToRgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  const t = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return t.map(k => Math.round((k + m) * 255));
}
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? 60 * (((g - b) / d) % 6) : mx === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
  return [(h + 360) % 360, mx ? d / mx : 0, mx];
}
function rgbToCmyk(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const k = 1 - Math.max(r, g, b);
  if (k >= 0.9999) return [0, 0, 0, 100];
  return [(1 - r - k) / (1 - k) * 100, (1 - g - k) / (1 - k) * 100, (1 - b - k) / (1 - k) * 100, k * 100];
}
function cmykToRgb(c, m, y, k) {
  return [c, m, y].map(v => Math.round(255 * (1 - v / 100) * (1 - k / 100)));
}
const hexOf = rgb => '#' + rgb.map(x => clamp(Math.round(x), 0, 255).toString(16).padStart(2, '0')).join('').toUpperCase();
function parseHex(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h.trim());
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}

let H = 215, S = 0.4, V = 0.42, mode = 'rgb', link = null;
const recentsMax = 8;
let recents = [];
const preset = ['#2A2A27', '#D9D6CC', '#EEECE4', '#3B4F6B', '#A4512E', '#1B1B19', '#4A4A45', '#6F6E68', '#A9A89F', '#C9C5B8', '#F5F3EC', '#2E4057', '#5C7A99', '#8FA7BD', '#7A3B22', '#C27A55'];

const brushes = [
  { name: 'Pencil', size: 4, hardness: 0.9, diff: [0, 0, 0, 0] },
  { name: 'Soft round', size: 22, hardness: 0.2, diff: [0, 0, 0, 0] },
  { name: 'Flat', size: 14, hardness: 1, diff: [0, 0, 0, 0] },
  { name: 'Eraser soft', size: 30, hardness: 0.3, diff: [0, 0, 0, -255] },
  { name: 'Eraser hard', size: 12, hardness: 1, diff: [0, 0, 0, -255] },
  { name: 'Red flat', size: 14, hardness: 1, diff: [255, 0, 0, 0] },
  { name: 'Grain', size: 18, hardness: 0.5, diff: [0, 0, 0, 0] },
  { name: 'Fine line', size: 2, hardness: 1, diff: [0, 0, 0, 0] },
  { name: 'Blank', size: 10, hardness: 1, diff: [0, 0, 0, 0] }
];
let slot = 0;

function currentRgb() { return hsvToRgb(H, S, V); }
function currentHex() { return hexOf(currentRgb()); }

function applyHex(hex, record) {
  const rgb = parseHex(hex);
  if (!rgb) return;
  [H, S, V] = rgbToHsv(...rgb);
  if (record !== false) recents = [hexOf(rgb)].concat(recents.filter(h => h !== hexOf(rgb))).slice(0, recentsMax);
  updateAll();
}

const wheel = $('wheel'), wctx = wheel.getContext('2d');
function drawWheel() {
  const img = wctx.createImageData(200, 200), d = img.data;
  for (let y = 0; y < 200; y++) for (let x = 0; x < 200; x++) {
    const dx = x + 0.5 - 100, dy = y + 0.5 - 100, r = Math.hypot(dx, dy), i = (y * 200 + x) * 4;
    let c = null;
    if (r >= 70 && r <= 100) c = hsvToRgb((Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360, 1, 1);
    else if (Math.abs(dx) + Math.abs(dy) <= 60) c = hsvToRgb(H, clamp((dx / 60 + 1 + dy / 60) / 2, 0, 1), clamp((dx / 60 + 1 - dy / 60) / 2, 0, 1));
    if (c) { d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; }
  }
  wctx.putImageData(img, 0, 0);
  const mark = (x, y) => {
    wctx.beginPath(); wctx.arc(x, y, 6, 0, Math.PI * 2);
    wctx.strokeStyle = '#FFFFFF'; wctx.lineWidth = 2; wctx.stroke();
    wctx.strokeStyle = '#2A2A27'; wctx.lineWidth = 1; wctx.stroke();
  };
  const a = H * Math.PI / 180;
  mark(100 + Math.cos(a) * 85, 100 + Math.sin(a) * 85);
  mark(100 + 60 * (S + V - 1), 100 + 60 * (S - V));
}
const wheelPos = e => { const r = wheel.getBoundingClientRect(); return { x: (e.clientX - r.left) * 200 / r.width, y: (e.clientY - r.top) * 200 / r.height }; };
let wdrag = null;
wheel.addEventListener('pointerdown', e => {
  const q = wheelPos(e), dx = q.x - 100, dy = q.y - 100, r = Math.hypot(dx, dy);
  if (r >= 70 && r <= 100) wdrag = 'hue';
  else if (Math.abs(dx) + Math.abs(dy) <= 60) wdrag = 'sv';
  else return;
  wheel.setPointerCapture(e.pointerId);
  moveWheel(q);
});
wheel.addEventListener('pointermove', e => { if (wdrag) moveWheel(wheelPos(e)); });
wheel.addEventListener('pointerup', () => { if (wdrag) { wdrag = null; recordRecent(); } });
function moveWheel(q) {
  const dx = q.x - 100, dy = q.y - 100;
  if (wdrag === 'hue') H = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  else { S = clamp((dx / 60 + 1 + dy / 60) / 2, 0, 1); V = clamp((dx / 60 + 1 - dy / 60) / 2, 0, 1); }
  updateAll();
}
function recordRecent() {
  const h = currentHex();
  recents = [h].concat(recents.filter(x => x !== h)).slice(0, recentsMax);
  updateAll();
}

const DEFS = { rgb: [['R', 0, 255], ['G', 0, 255], ['B', 0, 255]], hsv: [['H', 0, 360], ['S', 0, 100], ['V', 0, 100]], cmyk: [['C', 0, 100], ['M', 0, 100], ['Y', 0, 100], ['K', 0, 100]] };
function comps() { const rgb = currentRgb(); return { rgb, hsv: [H, S * 100, V * 100], cmyk: rgbToCmyk(...rgb) }; }
function toRgb(arr, m) { return m === 'rgb' ? arr : m === 'hsv' ? hsvToRgb(arr[0], arr[1] / 100, arr[2] / 100) : cmykToRgb(...arr); }
function setComp(i, val) {
  const c = comps()[mode].slice(); c[i] = Number(val);
  if (mode === 'rgb') [H, S, V] = rgbToHsv(...c);
  else if (mode === 'hsv') { H = c[0]; S = c[1] / 100; V = c[2] / 100; }
  else [H, S, V] = rgbToHsv(...cmykToRgb(...c));
  updateAll();
}
const rowRefs = [];
function buildRows() {
  const box = $('rows'); box.innerHTML = ''; rowRefs.length = 0;
  DEFS[mode].forEach(([label, min, max], i) => {
    const row = document.createElement('div'); row.className = 'row';
    const L = document.createElement('span'); L.className = 'lbl'; L.textContent = label;
    const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = 1; r.setAttribute('aria-label', label);
    const n = document.createElement('input'); n.type = 'number'; n.className = 'num'; n.min = min; n.max = max;
    r.addEventListener('input', () => setComp(i, r.value));
    r.addEventListener('change', recordRecent);
    n.addEventListener('change', () => { setComp(i, clamp(Number(n.value), min, max)); recordRecent(); });
    row.append(L, r, n); box.append(row); rowRefs.push({ r, n, i });
  });
  updateAll();
}
document.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.m;
  document.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === b));
  buildRows();
}));

function renderMini() {
  const box = $('mini'); box.innerHTML = '';
  const make = (hex, isLinked, onTap) => {
    const b = document.createElement('button');
    b.className = 'sw' + (isLinked ? ' linked' : ''); b.style.background = hex; b.setAttribute('aria-label', hex);
    b.addEventListener('click', onTap); return b;
  };
  recents.forEach(h => box.append(make(h, false, () => applyHex(h))));
  preset.forEach((h, j) => box.append(make(h, link === j, () => { link = j; applyHex(h); })));
  const add = document.createElement('button');
  add.className = 'sw'; add.textContent = '+'; add.setAttribute('aria-label', 'Add current colour');
  add.addEventListener('click', () => { preset.push(currentHex()); link = preset.length - 1; renderMini(); });
  box.append(add);
}

function updateAll() {
  if (link !== null && preset[link] !== undefined) preset[link] = currentHex();
  const c = comps()[mode];
  rowRefs.forEach(ref => {
    const v = Math.round(c[ref.i]); ref.r.value = v; ref.n.value = v;
  });
  $('hex').value = currentHex();
  $('preview').style.background = currentHex();
  drawWheel(); renderMini(); render();
}
$('hex').addEventListener('change', () => applyHex($('hex').value));

const pad = $('pad'), pctx = pad.getContext('2d');
const p = { x: 340, y: 220 }, b = { x: 340, y: 220 };
let strokes = [], current = null, drawing = false, running = false;
const stabIn = $('stab');
function ropeLen() { return Number(stabIn.value) * 1.8; }
function padPos(e) { const r = pad.getBoundingClientRect(); return { x: (e.clientX - r.left) * 680 / r.width, y: (e.clientY - r.top) * 440 / r.height }; }

function drawStroke(s) {
  const brush = brushes[s.slot], pts = s.pts;
  pctx.save();
  if (brush.diff[3] < 0) pctx.globalCompositeOperation = 'destination-out';
  pctx.strokeStyle = s.colour; pctx.fillStyle = s.colour;
  pctx.lineWidth = brush.size; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.globalAlpha = 0.4 + brush.hardness * 0.6;
  pctx.beginPath();
  pctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    pctx.bezierCurveTo(p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6, p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6, p2.x, p2.y);
  }
  pctx.stroke();
  pctx.restore();
}
function drawRope() {
  const L = Math.max(ropeLen(), 1), d = Math.hypot(p.x - b.x, p.y - b.y), t = Math.min(d / L, 1);
  pctx.save();
  pctx.strokeStyle = '#3B4F6B'; pctx.globalAlpha = 0.3 + t * 0.7; pctx.lineWidth = 0.5 + t * 2.5; pctx.lineCap = 'round';
  pctx.beginPath(); pctx.moveTo(p.x, p.y); pctx.lineTo(b.x, b.y); pctx.stroke();
  pctx.restore();
  pctx.beginPath(); pctx.arc(p.x, p.y, 6, 0, Math.PI * 2); pctx.strokeStyle = '#3B4F6B'; pctx.lineWidth = 1; pctx.stroke();
  pctx.beginPath(); pctx.arc(b.x, b.y, 10, 0, Math.PI * 2); pctx.fillStyle = '#2A2A27'; pctx.fill();
}
function render() {
  pctx.clearRect(0, 0, 680, 440);
  strokes.forEach(drawStroke);
  drawRope();
}
function tick() {
  const L = ropeLen(), dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
  let moved = 0;
  if (d > L) { const nx = p.x + dx * L / d, ny = p.y + dy * L / d; moved = Math.hypot(nx - b.x, ny - b.y); b.x = nx; b.y = ny; }
  if (drawing && moved > 0.05 && current) {
    const last = current.pts[current.pts.length - 1];
    if (Math.hypot(last.x - b.x, last.y - b.y) > 0.8) current.pts.push({ x: b.x, y: b.y });
  }
  render();
  if (moved > 0.05 || drawing) requestAnimationFrame(tick); else running = false;
}
function kick() { if (!running) { running = true; requestAnimationFrame(tick); } else render(); }
pad.addEventListener('pointerdown', e => {
  pad.setPointerCapture(e.pointerId);
  const q = padPos(e); p.x = q.x; p.y = q.y;
  if (e.pointerType === 'touch') { b.x = p.x; b.y = p.y; }
  drawing = true;
  current = { slot, colour: currentHex(), pts: [{ x: b.x, y: b.y }] };
  strokes.push(current);
  kick();
});
pad.addEventListener('pointermove', e => { if (!drawing && e.buttons === 0) return; const q = padPos(e); p.x = q.x; p.y = q.y; kick(); });
pad.addEventListener('pointerup', () => { drawing = false; current = null; kick(); });
pad.addEventListener('pointercancel', () => { drawing = false; current = null; });
stabIn.addEventListener('input', () => { $('sv').textContent = stabIn.value; kick(); });
$('clear').addEventListener('click', () => { strokes = []; render(); });

function selectSlot(i) {
  slot = i;
  const br = brushes[i];
  $('brushName').textContent = br.name;
  renderBar();
}
function renderBar() {
  const bar = $('bar'), menu = $('menu');
  bar.innerHTML = ''; menu.innerHTML = '';
  brushes.forEach((br, i) => {
    const btn = document.createElement('button');
    btn.className = 'slot' + (i === slot ? ' on' : '');
    btn.innerHTML = '<span>' + br.name + '</span><small>' + (i + 1) + '</small>';
    btn.addEventListener('click', () => selectSlot(i));
    if (i < 3) bar.append(btn); else menu.append(btn);
  });
  menu.querySelectorAll('.slot').forEach(el => el.className = el.className);
}
const more = $('more'), menu = $('menu');
function setMenu(open) {
  menu.classList.toggle('open', open);
  more.setAttribute('aria-expanded', String(open));
  more.classList.toggle('on', open);
}
more.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
document.addEventListener('pointerdown', e => {
  if (!menu.contains(e.target) && e.target !== more) setMenu(false);
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9) selectSlot(n - 1);
});

renderBar();
selectSlot(0);
buildRows();
drawWheel();
renderMini();
kick();
})();
</script>
</body>
</html>
