<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwell 2</title>
<link rel="icon" href="data:,">
<style>
:root{--graphite:#2A2A27;--slate:#D9D6CC;--bone:#EEECE4;--iron:#3B4F6B;--rust:#A4512E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;height:100%;overflow:hidden;background:var(--graphite);color:var(--bone);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.board{position:absolute;left:0;top:0;width:2048px;height:1536px;transform-origin:0 0;background:#EEECE4;box-shadow:0 10px 50px #0009}
.board canvas{display:block;width:2048px;height:1536px}
.mod{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:var(--slate);color:var(--graphite);border-radius:12px;padding:4px;transition:left .16s ease,top .16s ease}
.mod.v{flex-direction:column}
.mod.dragging{transition:none;opacity:.92;z-index:9}
.grip{width:16px;height:32px;border:0;background:none;cursor:grab;position:relative;padding:0}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:18px;margin:-9px 0 0 -2px;border-radius:2px;background:currentColor;opacity:.6}
.mod.v .grip{width:32px;height:16px}
.mod.v .grip::after{width:18px;height:4px;margin:-2px 0 0 -9px}
.bar{padding:6px}
.sep{width:1px;height:22px;background:#2A2A2733;margin:0 4px}
.slots{display:flex;gap:4px}
.slot{width:40px;height:40px;padding:0;display:grid;place-items:center;position:relative;border-radius:8px}
.slot i{display:block;border-radius:50%}
.slot small{position:absolute;left:4px;top:2px;font-size:9px;opacity:.7}
.slot.on{background:var(--iron);border-color:var(--iron)}
.slot.on i{background:var(--bone)!important}
.txt{padding:6px 10px}
.bname{font-size:12px;opacity:.75;margin:0 6px;min-width:70px}
.menu{position:absolute;bottom:calc(100% + 8px);right:0;display:none;grid-template-columns:repeat(3,44px);gap:6px;background:var(--slate);padding:8px;border-radius:12px;box-shadow:0 0 0 .5px #2A2A27}
.menu.open{display:grid}
.menu .slot{width:44px;height:44px}
#more.on{background:var(--iron);color:var(--bone)}
.bp{flex-direction:column;align-items:stretch;width:230px;gap:8px;padding:8px}
.bp-title{font-weight:600;padding:2px 2px 4px}
.bp-row{display:grid;grid-template-columns:72px 1fr 48px;align-items:center;gap:6px;font-size:12px}
.bp-row input{accent-color:var(--iron);min-width:0}
.bp-row output{text-align:right;font-variant-numeric:tabular-nums;opacity:.75}
.cp{flex-direction:column;align-items:stretch;width:240px;gap:8px}
.cp-head{display:flex;align-items:center;gap:8px;cursor:grab}
.cp-preview{width:32px;height:32px;border-radius:8px;border:.5px solid var(--graphite);flex:none}
.cp-hex{width:84px;font:inherit;border:none;background:transparent;color:var(--graphite);opacity:.7}
.cp-wheel{width:200px;height:200px;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
.cp-mini{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;padding:0;border-radius:5px;border:.5px solid var(--graphite)}
.sw.linked{border:2px solid var(--graphite)}
.sw.add{font-size:14px;line-height:1}
.cp-modes{display:flex;gap:4px}
.cp-modes button{flex:1;height:22px;padding:0;font-size:11px}
.cp-modes button.on{background:var(--iron);color:var(--bone)}
.cp-rows{display:flex;flex-direction:column;gap:6px}
.cp-row{display:flex;align-items:center;gap:8px;height:22px}
.cp-lbl{width:10px;font-size:11px;opacity:.7}
.cp-row .sl,.cp-row input[type=range]{flex:1;min-width:0;height:12px;accent-color:var(--iron)}
.num{width:40px;height:22px;font:inherit;font-size:11px;padding:0 3px;border:.5px solid var(--iron);border-radius:6px;background:var(--bone);color:var(--graphite);box-sizing:border-box;-moz-appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
button:disabled{opacity:.4;cursor:default}
button{font:inherit;color:var(--graphite);background:transparent;border:0.5px solid var(--iron);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--iron);outline-offset:2px}
#chip{width:36px;height:36px;justify-content:center;padding:0}
#panel{width:220px;flex-direction:column;align-items:stretch}
.edgehint{position:absolute;z-index:8;background:var(--rust);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .12s}
.edgehint.on{opacity:.9}
.edgehint[data-edge=top]{left:10px;right:10px;top:4px;height:3px}
.edgehint[data-edge=bottom]{left:10px;right:10px;bottom:4px;height:3px}
.edgehint[data-edge=left]{top:10px;bottom:10px;left:4px;width:3px}
.edgehint[data-edge=right]{top:10px;bottom:10px;right:4px;width:3px}
body.nui .mod:not(#chip){display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="stage"><div id="board" class="board"><canvas width="2048" height="1536" style="background:#EEECE4"></canvas></div></div>
  <div id="bar" class="mod bar"><button class="grip" aria-label="Move action bar"></button><button id="undo" class="txt">Undo</button><button id="redo" class="txt">Redo</button><span class="sep"></span><div id="slots" class="slots"></div><span id="brushname" class="bname"></span><button id="more" class="txt" aria-expanded="false" aria-controls="menu" aria-label="Brush slots 4 to 9">More</button><div id="menu" class="menu" role="group" aria-label="Quick access"></div></div>
  <div id="panel" class="mod"><div class="row" style="display:flex;align-items:center;gap:6px"><button class="grip" aria-label="Move panel"></button><span>Panel</span><button id="reset" style="margin-left:auto">Reset layout</button></div></div>
  <div id="colour" class="mod panel cp"></div>
  <div id="brush" class="mod panel bp"></div>
  <button id="chip" class="mod" aria-label="Hide interface">&#9675;</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
