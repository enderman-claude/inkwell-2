<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwell 2</title>
<style>
:root{--graphite:#2A2A27;--slate:#D9D6CC;--bone:#EEECE4;--iron:#3B4F6B;--rust:#A4512E;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;height:100%;overflow:hidden;background:var(--graphite);color:var(--bone);font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;user-select:none}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.board{position:absolute;left:0;top:0;width:2048px;height:1536px;transform-origin:0 0;background:#EEECE4;box-shadow:0 10px 50px #0009}
.board canvas{display:block;width:2048px;height:1536px}
.mod{position:absolute;z-index:4;display:flex;align-items:center;gap:6px;background:var(--slate);color:var(--graphite);border-radius:12px;padding:4px;transition:left .16s ease,top .16s ease}
.mod.v{flex-direction:column}
.mod.dragging{transition:none;opacity:.92;z-index:9}
.grip{width:16px;height:32px;border:0;background:none;cursor:grab;position:relative;padding:0}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:18px;margin:-9px 0 0 -2px;border-radius:2px;background:currentColor;opacity:.6}
.mod.v .grip{width:32px;height:16px}
.mod.v .grip::after{width:18px;height:4px;margin:-2px 0 0 -9px}
button{font:inherit;color:var(--graphite);background:transparent;border:0.5px solid var(--iron);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible{outline:2px solid var(--iron);outline-offset:2px}
#chip{width:36px;height:36px;justify-content:center;padding:0}
#panel{width:220px;flex-direction:column;align-items:stretch}
.edgehint{position:absolute;z-index:8;background:var(--rust);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .12s}
.edgehint.on{opacity:.9}
.edgehint[data-edge=top]{left:10px;right:10px;top:4px;height:3px}
.edgehint[data-edge=bottom]{left:10px;right:10px;bottom:4px;height:3px}
.edgehint[data-edge=left]{top:10px;bottom:10px;left:4px;width:3px}
.edgehint[data-edge=right]{top:10px;bottom:10px;right:4px;width:3px}
body.nui .mod:not(#chip){display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="stage"><div id="board" class="board"><canvas width="2048" height="1536"></canvas></div></div>
  <div id="bar" class="mod"><button class="grip" aria-label="Move action bar"></button><button>Undo</button><button>Redo</button></div>
  <div id="panel" class="mod"><div class="row" style="display:flex;align-items:center;gap:6px"><button class="grip" aria-label="Move panel"></button><span>Panel</span><button id="reset" style="margin-left:auto">Reset layout</button></div></div>
  <button id="chip" class="mod" aria-label="Hide interface">&#9675;</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
