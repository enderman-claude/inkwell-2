<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwell 2</title>
<link rel="icon" href="data:,">
<style>
/*FONTS*/
:root{--bg:#2A2A27;--panel:#D9D6CC;--ink:#2A2A27;--ink-soft:#2A2A27;--field:#EEECE4;--on-accent:#EEECE4;--accent:#3B4F6B;--hover:#2A2A2714;--line:#2A2A2733;--rust:#A4512E;color-scheme:light}
[data-theme=dark]{--bg:#161614;--panel:#2A2A27;--ink:#EEECE4;--ink-soft:#D9D6CC;--field:#1B1B19;--on-accent:#EEECE4;--accent:#5C7A99;--hover:#EEECE41A;--line:#EEECE433;--rust:#C8714A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink-soft);font:400 14px/1.3 "Hanken Grotesk",system-ui,sans-serif;user-select:none}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:crosshair}
.board{position:absolute;left:0;top:0;width:2048px;height:1536px;transform-origin:0 0;background:#EEECE4;box-shadow:0 10px 50px #0009}
.mod{position:absolute;z-index:4;display:flex;align-items:center;gap:4px;background:var(--panel);color:var(--ink);border-radius:12px;padding:4px;transition:left .16s ease,top .16s ease}
.mod.v{flex-direction:column}
.mod.dragging{transition:none;opacity:.92;z-index:9}
.grip{width:14px;height:30px;border:0;background:none;cursor:grab;position:relative;padding:0;flex:none;touch-action:none}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:16px;margin:-8px 0 0 -2px;border-radius:2px;background:currentColor;opacity:.45}
.mod.v .grip{width:30px;height:14px}
.mod.v .grip::after{width:16px;height:4px;margin:-2px 0 0 -8px}
.btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--hover)}
.btn.on{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.slots{display:flex;gap:4px}
.slot{width:40px;height:40px;padding:0;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;position:relative;cursor:pointer}
.slot:hover{background:var(--hover)}
.slot.on{background:var(--accent)}
.slot canvas{display:block;width:32px;height:28px}
.slot small{position:absolute;left:5px;top:3px;font-size:9px;opacity:.6;color:var(--ink)}
.slot.on small{color:var(--on-accent)}
.more-wrap{position:relative}
.menu{position:absolute;bottom:calc(100% + 8px);right:0;display:none;grid-template-columns:repeat(3,40px);gap:4px;background:var(--panel);padding:6px;border-radius:12px;box-shadow:0 0 0 .5px var(--line),0 8px 24px #0005}
.menu.open{display:grid}
.menu .slot{width:40px;height:40px}
.edgehint{position:absolute;z-index:8;background:var(--rust);border-radius:2px;opacity:0;pointer-events:none;transition:opacity .12s}
.edgehint.on{opacity:.9}
.edgehint[data-edge=top]{left:10px;right:10px;top:4px;height:3px}
.edgehint[data-edge=bottom]{left:10px;right:10px;bottom:4px;height:3px}
.edgehint[data-edge=left]{top:10px;bottom:10px;left:4px;width:3px}
.edgehint[data-edge=right]{top:10px;bottom:10px;right:4px;width:3px}
body.nui .mod:not(#chip){display:none}
.checker{background:repeating-conic-gradient(#9994 0 25%,transparent 0 50%) 0 0/10px 10px}

/* colour */
.cp{flex-direction:column;align-items:stretch;width:240px;gap:8px}
.cp-head{display:flex;align-items:center;gap:8px;cursor:grab}
.cp-preview{width:32px;height:32px;border-radius:8px;flex:none;box-shadow:0 0 0 .5px var(--line)}
.cp-hex{width:84px;font:inherit;border:0;background:transparent;color:var(--ink);opacity:.7}
.cp-wheel{width:200px;height:200px;display:block;margin:0 auto;touch-action:none;cursor:crosshair}
.cp-mini{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;padding:0;border-radius:5px;border:0;box-shadow:0 0 0 .5px var(--line);cursor:pointer}
.sw.linked{box-shadow:0 0 0 2px var(--ink)}
.sw.add{background:transparent!important;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);display:grid;place-items:center}
.sw.add svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.seg{display:flex;gap:2px;background:var(--field);border-radius:8px;padding:2px}
.seg button{flex:1;height:22px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.cp-rows{display:flex;flex-direction:column;gap:6px}
.cp-row{display:flex;align-items:center;gap:8px;height:22px}
.cp-lbl{width:10px;font-size:11px;opacity:.7}
.cp-row input[type=range],.bp-row input[type=range]{flex:1;min-width:0;height:12px;accent-color:var(--accent)}
.num{width:40px;height:22px;font:inherit;font-size:11px;padding:0 3px;border:0;border-radius:6px;background:var(--field);color:var(--ink);-moz-appearance:textfield;appearance:textfield}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* brush */
.bp{flex-direction:column;align-items:stretch;width:230px;gap:8px;padding:8px}
.bp-preview{width:100%;height:56px;border-radius:8px;background:var(--field);display:block}
.bp-row{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:6px;font-size:12px}
.bp-row output{text-align:right;font-variant-numeric:tabular-nums;opacity:.75}

/* dialogs */
dialog.newdoc{background:var(--panel);color:var(--ink);border:0;border-radius:12px;padding:0;box-shadow:0 12px 40px #0008;width:340px}
dialog.newdoc::backdrop{background:#0006}
dialog.newdoc form{display:flex;flex-direction:column;gap:12px;padding:18px}
dialog.newdoc label{display:flex;flex-direction:column;gap:4px;font-size:12px}
dialog.newdoc input,dialog.newdoc select{font:inherit;font-size:13px;background:var(--field);color:var(--ink);border:0;border-radius:8px;padding:7px 9px}
dialog.newdoc input:disabled{opacity:.5}
.nd-size{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nd-err{margin:0;min-height:1em;font-size:12px;color:var(--rust)}
.nd-actions{display:flex;justify-content:flex-end;gap:8px}
.nd-actions button{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:0;cursor:pointer;background:transparent;color:var(--ink)}
.nd-actions .nd-ok{background:var(--accent);color:var(--on-accent)}

/* tools */
.tl{flex-direction:column;align-items:stretch;padding:6px;gap:4px}
.tl-group{display:grid;grid-template-columns:repeat(2,34px);gap:2px;padding-bottom:4px;box-shadow:0 1px 0 var(--line)}
.tl-group:empty{display:none}
.tl-group button.btn.on{background:var(--accent);color:var(--on-accent)}
.tl-head{display:flex;justify-content:center}
.tl-head .grip{width:30px;height:14px}
.tl-head .grip::after{width:16px;height:4px;margin:-2px 0 0 -8px}

/* library */
.lib{flex-direction:column;align-items:stretch;width:300px;gap:6px;padding:8px;max-height:60vh}
.lib-head{display:flex;align-items:center;gap:4px}
.lib-tabs{flex:1;min-width:0}
.lib-tabs button{flex:1;min-width:0;white-space:nowrap;padding:0 4px}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;overflow:auto;min-height:0;padding:2px}
.lib-card{display:flex;flex-direction:column;gap:2px;padding:4px;border:0;border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:11px;cursor:pointer;text-align:left}
.lib-card canvas{width:100%;height:auto;display:block;border-radius:6px;background:#EEECE4}
.lib-card:hover{box-shadow:inset 0 0 0 1px var(--line)}
.lib-card.on{box-shadow:inset 0 0 0 2px var(--accent)}

/* layers */
.ly{flex-direction:column;align-items:stretch;width:232px;gap:6px;padding:8px;max-height:72vh}
.ly-head{display:flex;align-items:center;gap:2px}
.ly-head .btn{width:30px;height:30px}
.ly-head .btn svg{width:16px;height:16px}
.ly-list{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.ly-row{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 6px;border-radius:8px;box-shadow:inset 3px 0 0 transparent}
.ly-row.on{box-shadow:inset 3px 0 0 var(--accent);background:var(--hover)}
.ly-row .btn{width:26px;height:26px}
.ly-row .btn svg{width:14px;height:14px}
.thumb{width:36px;height:27px;border-radius:4px;flex:none;box-shadow:0 0 0 .5px var(--line)}
.ly-name{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ly-props{display:flex;flex-direction:column;gap:6px;padding-top:6px;box-shadow:0 -.5px 0 var(--line)}
.ly-p{display:flex;align-items:center;gap:6px;font-size:12px}
.ly-p input[type=range]{flex:1;min-width:0;height:12px;accent-color:var(--accent)}
.op-track{flex:1;height:12px;border-radius:6px;background:linear-gradient(to right,transparent,var(--ink)),repeating-conic-gradient(#9994 0 25%,transparent 0 50%) 0 0/8px 8px;position:relative}
.ly-p select{font:inherit;font-size:12px;background:var(--field);color:var(--ink);border:0;border-radius:6px;padding:3px 4px;flex:1;min-width:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="stage"><div id="board" class="board"></div></div>
  <div id="bar" class="mod">
    <button class="grip" aria-label="Move action bar"></button>
    <button id="undo" class="btn" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button id="redo" class="btn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    <span class="sep"></span>
    <div id="slots" class="slots"></div>
    <button id="libtoggle" class="btn" title="Brush library" aria-label="Brush library"></button>
    <div class="more-wrap">
      <button id="more" class="btn" aria-expanded="false" aria-controls="menu" title="More brushes (keys 4 to 9)" aria-label="More brushes"></button>
      <div id="menu" class="menu" role="group" aria-label="Brushes 4 to 9"></div>
    </div>
  </div>
  <div id="panel" class="mod">
    <button class="grip" aria-label="Move interface panel"></button>
    <button id="f-new" class="btn" title="New project (Ctrl+N)" aria-label="New project"></button>
    <button id="f-open" class="btn" title="Open project (Ctrl+O)" aria-label="Open project"></button>
    <button id="f-save" class="btn" title="Save project (Ctrl+S)" aria-label="Save project"></button>
    <button id="f-import" class="btn" title="Import image (Ctrl+I, or paste or drop)" aria-label="Import image"></button>
    <span class="sep"></span>
    <button id="theme" class="btn" title="Switch theme" aria-label="Switch theme"></button>
    <button id="reset" class="btn" title="Reset layout" aria-label="Reset layout"></button>
  </div>
  <div id="colour" class="mod cp"></div>
  <div id="brush" class="mod bp"></div>
  <div id="layers" class="mod ly"></div>
  <div id="library" class="mod lib"></div>
  <div id="tools" class="mod tl"></div>
  <button id="chip" class="mod btn" title="Hide interface (H)" aria-label="Hide interface"></button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
